name: whatcanicook
description: "WHATCANICOOK — descubre qué puedes cocinar con los ingredientes que tienes."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.2
  shared_preferences: ^2.5.6
  image_picker: ^1.2.1
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  share_plus: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.3.6

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon_dark.png"
  adaptive_icon_background: "#161618"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground_dark.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/data/ingredients.json
    - assets/data/recipes.json
    - assets/logos/logo.png
    - assets/icons/app_icon.png
    - assets/icons/app_icon_dark.png
    - assets/icons/app_icon_foreground_dark.png
    - assets/images/splash.png
    - assets/images/recipes/
